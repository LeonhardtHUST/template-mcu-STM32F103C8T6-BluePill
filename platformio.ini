; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Core/Src
include_dir = Core/Inc
; test/ 使用系统 gcc 运行主机回归，不使用 pio test / Unity。
; 它位于 src_dir 之外，不参与固件构建。

[env:genericSTM32F103C8]
platform = ststm32@20.0.0
platform_packages =
    platformio/framework-stm32cubef1@1.8.7
    platformio/toolchain-gccarmnoneeabi@1.70201.0
    platformio/tool-ldscripts-ststm32@0.3.0
    platformio/tool-openocd@3.1200.7
board = genericSTM32F103C8
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
build_src_filter = +<*> -<system_stm32f1xx.c>
; 严格告警仅施加于工程源码，HAL/CMSIS 使用包自身的编译选项。
build_src_flags =
	-std=c11
	-Wall
	-Wextra
	-Werror
build_flags =
	-fdata-sections
	-ffunction-sections
	-Wl,--gc-sections
	-Wl,--print-memory-usage
	-Wl,-Map=${BUILD_DIR}/firmware.map
; 使用 printf("%f") 时取消下一行注释；newlib-nano 默认不包含浮点格式化。
; 会额外占用 Flash/RAM，最小闪灯模板不默认拉入。
;	-Wl,-u,_printf_float
; 烧录/调试探针：CMSIS-DAP（野火 FireDAP Lite 等，免驱 HID，仅支持 SWD）
; 若改用 ST-Link，把下面两行改回 stlink 即可
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
monitor_speed = 115200
