; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:genericSTM32F103C8]
platform = ststm32@20.0.0
platform_packages =
    platformio/framework-stm32cubef1@1.8.7
    platformio/toolchain-gccarmnoneeabi@1.70201.0
    platformio/tool-ldscripts-ststm32@0.3.0
    platformio/tool-openocd@3.1200.7
board = genericSTM32F103C8
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
build_src_filter = +<*> -<system_stm32f1xx.c>
build_flags =
	-Wall
	-fdata-sections
	-ffunction-sections
	-Wl,--gc-sections
	-Wl,--print-memory-usage
; 烧录/调试探针：CMSIS-DAP（野火 FireDAP Lite 等，免驱 HID，仅支持 SWD）
; 若改用 ST-Link，把下面两行改回 stlink 即可
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
monitor_speed = 115200
